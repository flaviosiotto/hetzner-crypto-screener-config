services:

  si8cloud-reverse-proxy:
    image: traefik:v3.3.4
    command:
      - --providers.docker=true
      - --entryPoints.web.address=:80
      - --providers.docker.exposedByDefault=false
    ports:
      - "8080:80"  # Cambiato da 80 a 8080
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    labels:
      - "traefik.enable=true"
    networks:
      - si8cloud-network

  si8cloud-postgres:
    image: postgres:17.2-alpine3.21
    volumes:
      - ${SI8CLOUD_POSTGRES_DATA_DIR}:/var/lib/postgresql/data
      - /etc/passwd:/etc/passwd:ro
    environment:
      - POSTGRES_DB=${SI8CLOUD_POSTGRES_DB}
      - POSTGRES_USER=${SI8CLOUD_POSTGRES_USER}
      - POSTGRES_PASSWORD=${SI8CLOUD_POSTGRES_PASSWORD}
    user: 1000:1000
    networks:
      - si8cloud-network

  si8cloud-pgadmin:
    image: dpage/pgadmin4:9.4.0
    labels:
      - traefik.enable=true
      - traefik.http.routers.si8cloud-pgadmin-console.rule=PathPrefix(`/si8cloud-pgadmin`)
      - traefik.http.services.si8cloud-pgadmin.loadbalancer.server.port=80
      - traefik.http.routers.si8cloud-pgadmin-console.entrypoints=web
    volumes:
      - ${SI8CLOUD_PGADMIN_DIR}:/var/lib/pgadmin
    environment:
      - PGADMIN_DEFAULT_EMAIL=${SI8CLOUD_PGADMIN_EMAIL}
      - PGADMIN_DEFAULT_PASSWORD=${SI8CLOUD_PGADMIN_PASSWORD}
      - PGADMIN_DISABLE_POSTFIX=True
      - PGADMIN_LISTEN_PORT=80
      - SCRIPT_NAME=/si8cloud-pgadmin
      - CONFIG_DATABASE_URI=postgresql://${SI8CLOUD_POSTGRES_USER}:${SI8CLOUD_POSTGRES_PASSWORD}@si8cloud-postgres:5432/${SI8CLOUD_POSTGRES_DB}
    depends_on:
      - si8cloud-postgres
    networks:
      - si8cloud-network

  si8cloud-console-be:
    build:
      context: ${SI8CLOUD_BE_SRC_DIR}

    # ───── Traefik ─────────────────────────────────────────
    labels:
      - "traefik.enable=true"
      # Router → intercetta qualunque path che inizi per /si8cloud-api
      - "traefik.http.routers.si8cloud-console-backend.rule=PathPrefix(`/si8cloud-api`)"
      - "traefik.http.routers.si8cloud-console-backend.entrypoints=web"   # <-- CORRETTO QUI
      # Middleware → rimuove il prefisso prima di passare al servizio
      - "traefik.http.middlewares.si8cloud-strip.stripprefix.prefixes=/si8cloud-api"
      - "traefik.http.routers.si8cloud-console-backend.middlewares=si8cloud-strip"
      # Backend service porta 8000
      - "traefik.http.services.si8cloud-console-be-service.loadbalancer.server.port=8000"

    # ───── Variabili d'ambiente ───────────────────────────
    environment:
      - DB_HOST=si8cloud-postgres
      - DB_NAME=${SI8CLOUD_POSTGRES_DB}
      - DB_PASSWORD=${SI8CLOUD_POSTGRES_PASSWORD}
      - DB_USER=${SI8CLOUD_POSTGRES_USER}
      - DB_PORT=5432
      - SECRET_KEY=${SI8CLOUD_SECRET_KEY:-loremipsum}
      # opzionale se nel codice leggi ROOT_PATH
      - ROOT_PATH=/si8cloud-api

    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ${SI8CLOUD_BE_SRC_DIR}:/code

    depends_on:
      - si8cloud-postgres

    # ───── Avvio Uvicorn con root-path ────────────────────
    command: >
      uvicorn app.main:app
      --host 0.0.0.0
      --port 8000
      --reload
      --root-path /si8cloud-api

    networks:
      - si8cloud-network

  si8cloud-console-fe:
    build:
      context: ${SI8CLOUD_FE_SRC_DIR}
    labels:
      - traefik.enable=true
      - traefik.http.routers.si8cloud-console-frontend.rule=PathPrefix(`/si8cloud-console`)
      - traefik.http.routers.si8cloud-console-frontend.entrypoints=web
    volumes:
      - ${SI8CLOUD_FE_SRC_DIR}:/src
      - /src/node_modules
    command: npm run dev
    working_dir: /src
    networks:
      - si8cloud-network

networks:
  si8cloud-network:
    driver: bridge